<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>内容工作台</title>
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" id="brand-mark">P</span>
      <div>
        <strong id="brand-name">内容工作台</strong>
        <span id="site-path" class="brand__path">正在连接…</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="工作台导航"></nav>
    <div class="topbar__status">
      <button type="button" id="help-button" class="btn btn--small btn--ghost">使用说明</button>
      <span id="dirty-pill" class="pill pill--warn" hidden>有未保存修改</span>
      <span id="session-pill" class="pill pill--muted">连接中…</span>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="editor" id="editor" aria-live="polite">
      <p class="empty-state">正在读取站点内容…</p>
    </section>
    <aside class="preview" id="preview-panel">
      <div class="preview__head">
        <span>实时预览 · 已保存的草稿</span>
        <button type="button" class="btn btn--small btn--ghost" id="refresh-preview">刷新预览</button>
      </div>
      <iframe id="preview-frame" title="站点预览" src="about:blank"></iframe>
      <p class="preview__note">预览读取已保存的草稿。文章、评论等外部内容接口在本地预览中可能不可用，属正常现象。</p>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="help-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
    <div class="modal__backdrop" data-close-help></div>
    <div class="modal__panel">
      <div class="modal__head">
        <h2 id="help-title">使用说明</h2>
        <button type="button" class="btn btn--small btn--ghost" data-close-help>关闭</button>
      </div>
      <div class="modal__body" id="help-body"></div>
    </div>
  </div>

  <script src="components.js"></script>
  <script src="core.js"></script>
  <script src="renderer-document.js"></script>
  <script src="renderer-collection.js"></script>
  <script src="renderer-media.js"></script>
  <script src="renderer-publish.js"></script>
</body>
</html>
